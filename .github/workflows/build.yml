name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComposeShot-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComposeShot-apk
          path: ComposeShot-v${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            "ComposeShot-v${{ github.run_number }}.apk" \
            --title "ComposeShot build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }}. Download the APK below and install it on your Android phone."
